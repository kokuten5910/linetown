<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LINEスタンプ・絵文字ギャラリー</title>
<style>
:root{--bg:#f4f8f4;--card:#fff;--tx:#223;--sub:#678;--bd:#dde6dd;--ac:#06c755;--ac2:#e3f8ea}
@media (prefers-color-scheme:dark){:root{--bg:#141a15;--card:#1f2721;--tx:#e8efe8;--sub:#9ab;--bd:#323d34;--ac:#2fd774;--ac2:#1d3524}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6}
main{max-width:980px;margin:0 auto;padding:16px}
.hero{text-align:center;padding:22px 8px 8px}.hero h1{font-size:24px;margin:0 0 6px}.hero p{margin:4px 0;color:var(--sub)}
.stats{display:flex;justify-content:center;gap:18px;margin:12px 0;font-size:13px;color:var(--sub)}.stats b{display:block;font-size:22px;color:var(--ac)}
.lk a{display:inline-block;margin:4px;padding:8px 14px;border-radius:20px;background:var(--ac);color:#fff;text-decoration:none;font-weight:700;font-size:13px}
h2{font-size:17px;margin:26px 0 10px;border-left:5px solid var(--ac);padding-left:8px}
.sub{color:var(--sub);font-size:12px}
.scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}.scroll .wc{min-width:150px;max-width:150px}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.cc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px;text-align:center;cursor:pointer}
.cc:hover{border-color:var(--ac)}.cc b{font-size:13px;display:block}
.bi{position:relative;height:96px;display:flex;align-items:center;justify-content:center}.bi .bld{height:92px;width:92px}.bi .res{position:absolute;right:2px;bottom:0;width:34px;height:34px;font-size:26px;filter:drop-shadow(0 1px 2px #0006)}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:16px;margin-bottom:8px}
.tag{display:inline-block;font-size:11px;padding:1px 9px;border-radius:12px;background:var(--ac2);margin:0 4px 4px 0}.tl{cursor:pointer}.tag.on{background:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.wc{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.th{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--ac2);font-size:40px}
.th .ph{width:46%;height:46%;opacity:.85;object-fit:contain}.th .tn{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--card)}
.new{position:absolute;left:6px;top:6px;background:#ff4d4f;color:#fff;font-size:10px;padding:1px 7px;border-radius:10px;z-index:2}
.bd{padding:8px;font-size:12px;line-height:1.5}.tt{font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.bd a{color:var(--ac);font-weight:700;text-decoration:none}
footer{text-align:center;color:var(--sub);font-size:12px;margin:30px 0 10px}
</style>
</head>
<body>
<main>
<header class="hero"><h1 id="ttl"></h1><p id="intro"></p><div class="stats" id="stats"></div><div class="lk" id="links"></div></header>
<h2>🆕 新着</h2><div class="scroll" id="new"></div>
<h2>🏘 キャラクター <span class="sub">（押すとそのキャラの作品を表示）</span></h2><div class="chars" id="chars"></div>
<h2 id="gsec">🔎 作品を探す <span class="sub" id="cnt"></span></h2>
<input id="q" placeholder="作品名・キャラ・タグで検索" oninput="q=this.value;drawF()">
<div id="types"></div><div id="tagsb"></div><div id="sel"></div>
<div class="grid" id="gal"></div>
<footer id="ft"></footer>
</main>
<script src="site.js"></script>
<script src="data.js"></script>

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const P=window.PROMO||{works:[],emoji:{},updated:""},SI=window.SITE||{};
const W=P.works,TN={s:"スタンプ",e:"絵文字",t:"着せかえ"};
const cm={};W.forEach(w=>(cm[w.c]=cm[w.c]||[]).push(w));
const CH=Object.entries(cm).sort((a,b)=>b[1].length-a[1].length);
const tm={};W.forEach(w=>w.g.forEach(t=>tm[t]=(tm[t]||0)+1));const TG=Object.entries(tm).sort((a,b)=>b[1]-a[1]);
const tier=n=>n<3?0:n<5?1:n<8?2:n<12?3:n<20?4:5;
const em=c=>(P.emoji&&P.emoji[c])||"✨";
const face=(c,cls)=>RI[c]?`<img class="${cls}" src="${RI[c]}" alt="">`:`<span class="${cls}">${em(c)}</span>`;
const days=r=>r&&P.updated?Math.floor((new Date(P.updated)-new Date(r))/864e5):9999;
let q="",ty="",ch="",sel=[];
const card=w=>`<div class="wc"><div class="th">${face(w.c,"ph")}${w.i?`<img class="tn" src="${esc(w.i)}" alt="" loading="lazy" onerror="this.style.display='none'">`:""}${days(w.r)<=30?'<b class="new">NEW</b>':""}</div><div class="bd"><div class="tt">${esc(w.t)}</div><div class="sub">${em(w.c)} ${esc(w.c)}・${TN[w.y]}</div><div>${w.g.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div><div class="sub">${w.r?"販売開始 "+w.r:""}</div>${w.u?`<a href="https://store.line.me/${esc(w.u)}" target="_blank" rel="noopener">LINEストアで見る ↗</a>`:""}</div></div>`;
function drawF(){const k=q.trim().toLowerCase(),f=W.filter(w=>(!ty||w.y===ty)&&(!ch||w.c===ch)&&sel.every(t=>w.g.includes(t))&&(!k||(w.t+w.c+w.g.join("")).toLowerCase().includes(k)));
$("types").innerHTML=["","s","e","t"].map(x=>`<span class="tag tl${ty===x?" on":""}" onclick="setTy('${x}')">${x?TN[x]:"すべて"}</span>`).join("");
$("tagsb").innerHTML=TG.map(([t,n],i)=>`<span class="tag tl${sel.includes(t)?" on":""}" onclick="togT(${i})">${esc(t)} ${n}</span>`).join("");
$("sel").innerHTML=ch?`<span class="tag on">${em(ch)} ${esc(ch)}</span> <a href="#gsec" onclick="ch='';drawF();return false">キャラの絞り込みを解除</a>`:"";
$("gal").innerHTML=f.map(card).join("")||'<p class="sub">該当する作品がありません</p>';$("cnt").textContent=f.length+"作品"}
function setTy(x){ty=x;drawF()}
function togT(i){const t=TG[i][0];sel=sel.includes(t)?sel.filter(x=>x!==t):[...sel,t];drawF()}
function setCh(i){ch=CH[i][0];drawF();$("gsec").scrollIntoView({behavior:"smooth"})}
document.title=SI.title||document.title;$("ttl").textContent=SI.title||"LINEスタンプ・絵文字ギャラリー";$("intro").textContent=SI.intro||"";
const nt={s:0,e:0,t:0};W.forEach(w=>nt[w.y]++);
$("stats").innerHTML=`<div><b>${W.length}</b>作品</div><div><b>${CH.length}</b>キャラ</div><div><b>${nt.s}</b>スタンプ</div><div><b>${nt.e}</b>絵文字</div>${nt.t?`<div><b>${nt.t}</b>着せかえ</div>`:""}`;
$("links").innerHTML=(SI.links||[]).filter(l=>l.url).map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("");
$("new").innerHTML=W.slice(0,8).map(card).join("");
$("chars").innerHTML=CH.map(([n,ws],i)=>`<div class="cc" onclick="setCh(${i})"><div class="bi"><img class="bld" src="${BI["t"+tier(ws.length)]}" alt="">${face(n,"res")}</div><b>${em(n)} ${esc(n)}</b><div class="sub">${ws.length}作品</div></div>`).join("");
$("ft").textContent=`最終更新 ${P.updated||""}${SI.footer?" ／ "+SI.footer:""}`;
drawF();
</script>
